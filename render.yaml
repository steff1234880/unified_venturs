databases:
  - name: unified-ventures-db
    databaseName: unified_ventures
    user: unified_admin
    plan: free
    region: oregon

services:
  - type: web
    name: unified-venturs
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: unified-ventures-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: ajayunified@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true

